<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>青屿优选 · 小而美的日常好物（静态演示）</title>
<meta name="description" content="青屿优选静态演示站：家居、户外、数码、厨房、文具、服饰与美妆分类的商品目录，分类与搜索均在浏览器内完成。">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M9 13h14l-1.6 10.4a2 2 0 0 1-2 1.6h-6.8a2 2 0 0 1-2-1.6z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M12.5 13a3.5 3.5 0 0 1 7 0' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<a class="skip-link" href="#catalog">跳到商品列表</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" focusable="false">
          <rect width="32" height="32" rx="9" fill="#2563eb"></rect>
          <path d="M9 13h14l-1.6 10.4a2 2 0 0 1-2 1.6h-6.8a2 2 0 0 1-2-1.6z" fill="none" stroke="#fff" stroke-width="2.1" stroke-linejoin="round"></path>
          <path d="M12.5 13a3.5 3.5 0 0 1 7 0" fill="none" stroke="#fff" stroke-width="2.1" stroke-linecap="round"></path>
        </svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">青屿优选</span>
        <span class="brand-slogan">小而美的日常好物</span>
      </span>
    </a>
    <div class="header-side">
      <span class="demo-chip" title="本站为演示站，不提供真实的购买、支付与物流服务">静态演示</span>
      <a class="header-link" href="#catalog">商品目录</a>
    </div>
  </div>
</header>

<section class="notice-wrap">
  <div class="notice" role="note" aria-label="站点公告">
    <div class="notice-head">
      <span class="notice-badge">公告</span>
      <strong class="notice-title">青屿优选 · 演示站点说明</strong>
    </div>
    <ul class="notice-list" id="noticeList"></ul>
  </div>
</section>

<main class="container" id="catalog">

  <nav class="tabs" id="tabs" aria-label="商品分类"></nav>

  <div class="search-row">
    <div class="search-box">
      <span class="search-icon" aria-hidden="true">
        <svg viewBox="0 0 20 20" width="18" height="18" focusable="false">
          <circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="m13 13 4 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </span>
      <input id="searchInput" class="search-input" type="search" autocomplete="off"
             placeholder="输入商品名称或分类搜索…" aria-label="搜索商品">
      <button id="searchClear" class="search-clear" type="button" aria-label="清除搜索" hidden>&times;</button>
    </div>
    <p class="result-line" id="resultLine" aria-live="polite"></p>
  </div>

  <div id="groups" class="groups"></div>

  <div id="emptyState" class="empty-state" hidden>
    <div class="empty-icon" aria-hidden="true">🔍</div>
    <p class="empty-title" id="emptyTitle">没有找到匹配的商品</p>
    <p class="empty-desc" id="emptyDesc">试试更换关键词，或切换到「全部」分类浏览。</p>
    <button id="emptyReset" class="btn-ghost" type="button">查看全部商品</button>
  </div>

</main>

<footer class="site-footer">
  <p class="footer-name">青屿优选 · 静态演示</p>
  <p class="footer-note">本站所有商品、价格、库存与图片均为虚构演示内容，仅用于展示前端目录结构，不提供真实的购买、支付、物流或售后服务。</p>
  <p class="footer-meta">原生 HTML / CSS / JavaScript · 无构建步骤 · 可直接部署到任意静态托管</p>
</footer>

<!-- 商品详情弹层 -->
<div class="modal" id="modal" hidden>
  <div class="modal-backdrop" data-close></div>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" type="button" data-close aria-label="关闭详情">&times;</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
